name: Dependencies (weekly)

# A report, never an update: it lands in the job summary and as an artifact.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  report:
    name: Outdated packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Report
        run: |
          chmod +x scripts/deps_report.sh
          scripts/deps_report.sh | tee deps-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: deps-report
          path: deps-report.md
